spring.application.name=youth-companion

# AI
ai.api-key=${MOONSHOT_API_KEY}
ai.base-url=https://api.moonshot.cn/v1
ai.model=moonshot-v1-8k

# Server
server.port=${PORT:8080}

# Safety Alert Mail
alert.mail.enabled=true
alert.mail.from=${ALERT_MAIL_USERNAME}
alert.mail.to=${ALERT_MAIL_TO}

# SMTP
spring.mail.host=${ALERT_MAIL_HOST}
spring.mail.port=${ALERT_MAIL_PORT:465}
spring.mail.username=${ALERT_MAIL_USERNAME}
spring.mail.password=${ALERT_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
